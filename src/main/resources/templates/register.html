<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register - Student Attendance Tracker</title>
    <style>
        :root{--purple:#6b46c1;--muted:#6b7280}
        body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;background:#f3f4f6}
        .card{width:480px;max-width:96%;margin:36px auto;background:#fff;border-radius:12px;padding:26px;box-shadow:0 6px 18px rgba(15,23,42,0.06)}
        h1{color:var(--purple);margin:0 0 6px}
        .muted{color:var(--muted);margin-bottom:12px}
        .tabs{display:flex;gap:8px;margin-bottom:12px}
        .tab{flex:1;padding:10px;border-radius:8px;background:#f1f5f9;text-align:center}
        .tab.active{background:#fff;box-shadow:inset 0 -2px 0 rgba(107,70,193,0.06)}
        label{display:block;margin-top:10px;color:#374151}
        input[type=text],input[type=password],input[type=email]{width:100%;padding:12px;border-radius:8px;border:1px solid #e6e9ef;margin-top:6px}
        .btn{background:var(--purple);color:#fff;padding:12px;border-radius:8px;border:none;margin-top:16px;width:100%;font-weight:600}
        .row{display:flex;gap:8px}
        .msg{color:#b91c1c;margin-bottom:8px}
        .success{color:#047857;margin-bottom:8px}
        a{color:var(--purple)}
    </style>
    <script>
        function validateRegister(e){
            var u=document.querySelector('[name="username"]').value.trim();
            var p=document.querySelector('[name="password"]').value.trim();
            if(!u || !p){
                e.preventDefault();
                document.getElementById('clientError').textContent='Username and password are required.';
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
<div class="card">
    <h1>Student Attendance Tracker</h1>
    <p class="muted">Create an account to access your dashboard</p>

    <div th:if="${errorMessage}" class="msg" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>
    <div id="clientError" class="msg" style="min-height:18px"></div>

    <form th:action="@{/register}" method="post" th:object="${userForm}" onsubmit="return validateRegister(event)">
        <label>Username</label>
        <input type="text" th:field="*{username}" name="username" placeholder="choose a username" required />

        <label>Password</label>
        <input type="password" th:field="*{password}" name="password" placeholder="choose a password" required />

        <label>Full name</label>
        <input type="text" th:field="*{fullName}" name="fullName" placeholder="Your full name" />

        <label>Email</label>
        <input type="email" th:field="*{email}" name="email" placeholder="you@example.com" />

        <label style="margin-top:12px">Role</label>
        <div style="display:flex; gap:8px; margin-top:6px">
            <label><input type="radio" th:field="*{role}" value="ADMIN" /> Admin</label>
            <label><input type="radio" th:field="*{role}" value="TEACHER" /> Teacher</label>
            <label><input type="radio" th:field="*{role}" value="STUDENT" checked="checked" /> Student</label>
        </div>

        <button class="btn" type="submit">Create account</button>
    </form>

    <p class="muted">Already have an account? <a th:href="@{/login}">Login here</a></p>
</div>
</body>
</html>
