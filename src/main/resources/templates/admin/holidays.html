<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Holidays - Admin</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        body { margin:0; font-family: Arial, sans-serif; background:#f3f4f6 }
        .container { display:flex; min-height:100vh }
        .sidebar { width:240px; background:linear-gradient(180deg,#6b46c1); color:white; padding:24px }
        .sidebar .brand { font-size:20px; font-weight:700; margin-bottom:18px }
        .nav { display:flex; flex-direction:column; gap:8px }
        .nav a { display:block; padding:10px 12px; color:#cbd5e1; text-decoration:none; border-radius:6px }
        .nav a.active { background:#C8A9F5; color:#fff }
        .nav a:hover { background:#A57DE9; color:#fff }
        .content { flex:1; padding:28px }
        .card { background:white; border-radius:8px; padding:20px; box-shadow: 0 2px 6px rgba(0,0,0,0.06) }
    </style>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="brand">SATracker — Admin</div>
        <nav class="nav">
            <a th:classappend="${active}=='dashboard'? ' active' : ''" th:href="@{/admin/dashboard}">Dashboard</a>
            <a th:classappend="${active}=='batches'? ' active' : ''" th:href="@{/admin/batches}">Batches</a>
            <a th:classappend="${active}=='teachers'? ' active' : ''" th:href="@{/admin/teachers}">Teachers</a>
            <a th:classappend="${active}=='students'? ' active' : ''" th:href="@{/admin/students}">Students</a>
            <a th:classappend="${active}=='holidays'? ' active' : ''" th:href="@{/admin/holidays}">Holidays</a>
            <a th:href="@{/logout}">Log Out</a>
        </nav>
    </aside>
    <main class="content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
            <h2>Holidays</h2>
            <div>
                <button id="addHolidayBtn" style="padding:8px 12px; background:#3b82f6; color:white; border:none; border-radius:6px; cursor:pointer">Add Holiday</button>
            </div>
        </div>

        <div id="holidaysList" style="display:flex; flex-direction:column; gap:8px"></div>

        <div id="holidayModal" style="position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,0.4)">
            <div style="width:420px; background:white; border-radius:8px; padding:18px; box-shadow:0 6px 20px rgba(0,0,0,0.2)">
                <h3 id="holidayModalTitle">Add Holiday</h3>
                <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px">
                    <label>Holiday Name<input id="holidayName" type="text" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px"/></label>
                    <label>Date<input id="holidayDate" type="date" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px"/></label>
                </div>
                <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px">
                    <button id="holidayCancel" style="padding:8px 12px; border-radius:6px; border:1px solid #ddd; background:white">Cancel</button>
                    <button id="holidaySave" style="padding:8px 12px; background:#10b981; color:white; border:none; border-radius:6px">Save</button>
                </div>
            </div>
        </div>

        <script>
            let editingHolidayId = null;

            async function loadHolidays(){
                try{
                    const res = await fetch('/admin/api/holidays');
                    const data = await res.json();
                    const list = document.getElementById('holidaysList');
                    list.innerHTML = '';
                    data.sort((a,b)=> new Date(a.date) - new Date(b.date)).forEach(h=>{
                        const el = document.createElement('div');
                        el.className = 'card';
                        el.innerHTML = `
                            <div style="display:flex; justify-content:space-between; align-items:center">
                                <div>
                                    <div style="font-weight:700">${escapeHtml(h.holidayName)}</div>
                                    <div style="color:#6b7280">${h.date}</div>
                                </div>
                                <div style="display:flex; gap:8px">
                                    <button data-id="${h.id}" class="editHoliday" style="padding:6px 10px; background:#f59e0b; color:white; border:none; border-radius:6px">Edit</button>
                                    <button data-id="${h.id}" class="delHoliday" style="padding:6px 10px; background:#ef4444; color:white; border:none; border-radius:6px">Delete</button>
                                </div>
                            </div>`;
                        list.appendChild(el);
                    });
                    document.querySelectorAll('.editHoliday').forEach(b=>b.addEventListener('click', e=> openHolidayEdit(e.currentTarget.getAttribute('data-id'))));
                    document.querySelectorAll('.delHoliday').forEach(b=>b.addEventListener('click', e=> deleteHoliday(e.currentTarget.getAttribute('data-id'))));
                }catch(e){console.error(e)}
            }

            function escapeHtml(text){ if(!text) return ''; return text.replace(/[&<>\"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[s])); }

            document.getElementById('addHolidayBtn').addEventListener('click', ()=>{
                editingHolidayId = null; document.getElementById('holidayModalTitle').textContent='Add Holiday';
                document.getElementById('holidayName').value=''; document.getElementById('holidayDate').value='';
                document.getElementById('holidayModal').style.display='flex';
            });
            document.getElementById('holidayCancel').addEventListener('click', ()=>document.getElementById('holidayModal').style.display='none');

            document.getElementById('holidaySave').addEventListener('click', async ()=>{
                const name = document.getElementById('holidayName').value.trim();
                const date = document.getElementById('holidayDate').value;
                if(!name || !date){ alert('Name and date required'); return; }
                try{
                    if(editingHolidayId){
                        const res = await fetch('/admin/api/holidays/'+editingHolidayId, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ holidayName: name, date: date }) });
                        if(!res.ok) throw new Error('Update failed');
                    }else{
                        const res = await fetch('/admin/api/holidays', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ holidayName: name, date: date }) });
                        if(!res.ok) throw new Error('Create failed');
                    }
                    document.getElementById('holidayModal').style.display='none';
                    loadHolidays();
                }catch(e){ alert(e.message||'Failed'); }
            });

            async function openHolidayEdit(id){
                try{
                    const res = await fetch('/admin/api/holidays');
                    const data = await res.json();
                    const h = data.find(x=>String(x.id)===String(id));
                    if(!h) return alert('Not found');
                    editingHolidayId = h.id;
                    document.getElementById('holidayModalTitle').textContent='Edit Holiday';
                    document.getElementById('holidayName').value = h.holidayName || '';
                    document.getElementById('holidayDate').value = h.date || '';
                    document.getElementById('holidayModal').style.display='flex';
                }catch(e){console.error(e)}
            }

            async function deleteHoliday(id){
                if(!confirm('Delete this holiday?')) return;
                try{
                    const res = await fetch('/admin/api/holidays/'+id, { method:'DELETE' });
                    if(res.status===204) loadHolidays(); else alert('Delete failed');
                }catch(e){ alert('Delete failed') }
            }

            loadHolidays();
        </script>
    </main>
</div>
</body>
</html>
