<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Student Performance</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        body { margin:0; font-family: Arial, sans-serif; background:#f3f4f6 }
        .container { display:flex; min-height:100vh }
        .sidebar { width:220px; background:linear-gradient(180deg,#6b46c1,#6b46c1); color:white; padding:20px }
        .sidebar .brand { font-size:20px; font-weight:700; margin-bottom:18px }
        .nav { display:flex; flex-direction:column; gap:8px }
        .nav a { display:block; padding:10px 12px; color:#cbd5e1; text-decoration:none; border-radius:6px }
        .nav a.active { background:#C8A9F5; color:#fff }
        .nav a:hover { background:#A57DE9; color:#fff }
        .content { flex:1; padding:28px }
        .card { background:white; border-radius:8px; padding:20px; box-shadow: 0 2px 6px rgba(0,0,0,0.06) }
        .grid { display:grid; grid-template-columns: 2fr 1fr; gap:16px; }
        @media (max-width: 900px){ .grid { grid-template-columns: 1fr; } }
        .muted { color:#64748b }
        .actions { display:flex; gap:10px; align-items:center }
        button, .btn { background:#6b46c1; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; text-decoration:none }
        button.secondary { background:#A57DE9 }
        .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="brand">SATracker — Student</div>
        <nav class="nav">
            <a th:classappend="${active}=='dashboard'? ' active' : ''" th:href="@{/student/dashboard}">Dashboard</a>
            <a th:classappend="${active}=='performance'? ' active' : ''" th:href="@{/student/performance}">Performance</a>
            <a th:href="@{/logout}">Log Out</a>
        </nav>
    </aside>
    <main class="content">
        <div class="row">
            <div>
                <h2 th:text="'Performance — ' + ${studentName}">Performance</h2>
                <p id="subtitle" class="muted">Attendance in current month</p>
            </div>
            <div class="actions">
                <select id="monthPicker"></select>
                <a id="download" class="btn" href="#">Download PDF</a>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Daily Attendance</h3>
                <canvas id="lineChart" height="120"></canvas>
            </div>
            <div class="card">
                <h3>This Month</h3>
                <canvas id="pieChart" height="120"></canvas>
            </div>
        </div>
    </main>
</div>

<script>
    const monthPicker = document.getElementById('monthPicker');
    const download = document.getElementById('download');
    const subtitle = document.getElementById('subtitle');

    // populate last 12 months
    function ymStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
    function ymLabel(d){ return d.toLocaleString('en', { month:'long', year:'numeric' }); }
    const now = new Date();
    for(let i=0;i<12;i++){
        const dt = new Date(now.getFullYear(), now.getMonth()-i, 1);
        const opt = document.createElement('option');
        opt.value = ymStr(dt);
        opt.textContent = ymLabel(dt);
        if(i===0) opt.selected = true;
        monthPicker.appendChild(opt);
    }

    let lineChart, pieChart;

    async function loadAll(){
        const m = monthPicker.value;
        const [summaryRes, seriesRes] = await Promise.all([
            fetch(`/student/api/summary?month=${m}`),
            fetch(`/student/api/series?month=${m}`)
        ]);
        const summary = await summaryRes.json();
        const series = await seriesRes.json();
        subtitle.textContent = `Attendance in ${summary.month} ${summary.year}`;
        // update download link
        download.href = `/student/report.pdf?month=${m}`;

        const labels = series.labels || [];
        const present = series.present || [];
        const absent = series.absent || [];
        const late = series.late || [];

        const ctx1 = document.getElementById('lineChart').getContext('2d');
        if(lineChart) lineChart.destroy();
        lineChart = new Chart(ctx1, {
            type:'bar',
            data:{ labels, datasets:[
                { label:'Present', data: present, backgroundColor:'#22c55e' },
                { label:'Absent', data: absent, backgroundColor:'#ef4444' },
                { label:'Late', data: late, backgroundColor:'#f59e0b' }
            ]},
            options:{
                responsive:true,
                plugins:{ legend:{ position:'top' } },
                scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } }
            }
        });

        const ctx2 = document.getElementById('pieChart').getContext('2d');
        if(pieChart) pieChart.destroy();
        pieChart = new Chart(ctx2, {
            type:'pie',
            data:{ labels:['Present','Absent','Late'], datasets:[{ data:[summary.present||0, summary.absent||0, summary.late||0], backgroundColor:['#22c55e','#ef4444','#f59e0b'] }]},
            options:{ responsive:true }
        });
    }

    monthPicker.addEventListener('change', loadAll);
    loadAll();
</script>
</body>
</html>
